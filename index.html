<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Органайзер</title>
<style>
  :root {
    /* "Мека зона" — топла неутрална основа, приглушен тийл акцент,
       по-заоблени форми (виж дизайн preview от 2026-08-09). */
    --paper: #f4f1e9;
    --ink: #2b2a25;
    --muted: #8b8878;
    --line: #e7e2d3;
    --accent: #3f7d82;
    --accent-ink: #2c5f63;
    --accent-soft: #dfeaea;
    --amber: #b1832f;
    --amber-soft: #f4e8d2;
    --red: #bd5142;
    --red-soft: #f6e2dd;
    --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #17190f; --ink: #e7e4d8; --muted: #948f7a; --line: #2c2f26;
      --accent: #6fb0b3; --accent-ink: #9ccdcf; --accent-soft: rgba(111,176,179,.14);
      --amber: #e0b563; --amber-soft: rgba(224,181,99,.14);
      --red: #e2897c; --red-soft: rgba(226,137,124,.14);
      --card: #1d201a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: -apple-system, "Segoe UI", "Noto Sans", system-ui, sans-serif;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 20px 80px; }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 16px; margin-bottom: 20px; border-bottom: 1px solid var(--line);
  }
  header.top h1 { font-size: 1.3rem; margin: 0; }
  header.top .who { font-size: .85rem; color: var(--muted); }
  button {
    font: inherit; cursor: pointer; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); border-radius: 8px; padding: 6px 13px;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.small { padding: 4px 10px; font-size: .8rem; border-radius: 999px; }
  button:disabled { opacity: .5; cursor: default; }
  a.linklike { color: var(--accent-ink); cursor: pointer; font-size: .8rem; background: none; border: none; padding: 0; text-decoration: underline; }

  /* --- login --- */
  #login-view { max-width: 360px; margin: 80px auto; }
  #login-view h1 { font-size: 1.4rem; margin-bottom: 4px; }
  #login-view p.lede { color: var(--muted); margin-top: 0; margin-bottom: 24px; font-size: .92rem; }
  #login-view label { display: block; font-size: .82rem; color: var(--muted); margin: 12px 0 4px; }
  #login-view input {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--ink); font: inherit;
  }
  #login-view button { width: 100%; margin-top: 18px; padding: 9px; }
  #login-error { color: var(--red); font-size: .85rem; margin-top: 10px; min-height: 1.2em; }

  /* --- tabs --- */
  nav.tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  nav.tabs button.tab { background: none; border: none; padding: 6px 4px; color: var(--muted); border-bottom: 2px solid transparent; border-radius: 0; }
  nav.tabs button.tab.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

  /* --- table (клиенти, форми) --- */
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; min-width: 640px; }
  thead th {
    text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line);
  }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tr.task-row { cursor: pointer; }
  tr.task-row:hover { background: var(--accent-soft); }
  .pill { display: inline-block; font-size: .72rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
  .pill-waiting { background: var(--amber-soft); color: var(--amber); }
  .pill-in_progress { background: var(--accent-soft); color: var(--accent-ink); }
  .pill-submitted { background: var(--accent-soft); color: var(--accent-ink); }
  .pill-completed { background: var(--line); color: var(--muted); }
  .pill-accepted { background: var(--accent-soft); color: var(--accent-ink); }
  .pill-rejected { background: var(--red-soft); color: var(--red); }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  .loading { padding: 30px; text-align: center; color: var(--muted); }
  .banner { padding: 10px 14px; border-radius: 8px; font-size: .85rem; margin-bottom: 14px; }
  .banner.err { background: var(--red-soft); color: var(--red); }
  .banner.ok { background: var(--accent-soft); color: var(--accent-ink); }

  /* --- KPI лента (задачи) --- */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; }
  .kpi .n { font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; color: var(--ink); }
  .kpi .n.warn { color: var(--red); }
  .kpi .l { font-size: .72rem; color: var(--muted); margin-top: 5px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  @media (max-width: 640px) { .kpis { grid-template-columns: repeat(2, 1fr); } }

  /* --- задачи: карти вместо таблица --- */
  .cards { display: flex; flex-direction: column; gap: 10px; }
  .card {
    display: flex; align-items: center; gap: 16px; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
    cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .card:hover { border-color: var(--accent); }
  .datebox {
    flex: 0 0 auto; width: 54px; text-align: center; border-radius: 10px; padding: 7px 4px;
    background: var(--accent-soft); color: var(--accent-ink);
  }
  .card.overdue .datebox { background: var(--red-soft); color: var(--red); }
  .datebox .d { font-size: 1.15rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .datebox .m { font-size: .62rem; text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
  .card .info { flex: 1 1 auto; min-width: 0; }
  .card .info .client { font-weight: 700; font-size: .93rem; }
  .card .info .obl { font-size: .82rem; color: var(--muted); margin-top: 1px; }
  .card .info .ref { font-size: .74rem; color: var(--muted); margin-top: 5px; font-variant-numeric: tabular-nums; }
  .card .meta { flex: 0 0 auto; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .card .assignee { font-size: .76rem; color: var(--muted); }

  /* --- детайли на задача/клиент --- */
  .detail-panel { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; }
  tr.detail-row td { background: var(--paper); padding: 16px 20px; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; font-size: .85rem; }
  .detail-block h4 { margin: 0 0 8px; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .attachment-item { padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .attachment-item:last-child { border-bottom: none; }

  /* --- AI chat --- */
  #ai-toggle {
    position: fixed; bottom: 20px; right: 20px; border-radius: 50%; width: 52px; height: 52px;
    background: var(--accent); color: #fff; border: none; font-size: 1.3rem; box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  #ai-panel {
    position: fixed; bottom: 84px; right: 20px; width: 320px; max-height: 440px;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,.2); display: none; flex-direction: column; overflow: hidden;
  }
  #ai-panel.open { display: flex; }
  #ai-panel header { padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: .88rem; }
  #ai-log { flex: 1; overflow-y: auto; padding: 10px 14px; font-size: .85rem; display: flex; flex-direction: column; gap: 10px; max-height: 300px; }
  #ai-log .msg-user { color: var(--ink); }
  #ai-log .msg-user b, #ai-log .msg-bot b { display: block; font-size: .7rem; color: var(--muted); margin-bottom: 2px; }
  #ai-form { display: flex; border-top: 1px solid var(--line); }
  #ai-input { flex: 1; border: none; padding: 10px; font: inherit; background: transparent; color: var(--ink); }
  #ai-input:focus { outline: none; }
</style>
</head>
<body>

  <div id="login-view">
    <h1>Органайзер</h1>
    <p class="lede">Мехов Консулт — проследяване на нормативни срокове</p>
    <form id="login-form">
      <label for="email">Имейл</label>
      <input id="email" type="email" autocomplete="username" required />
      <label for="password">Парола</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <button class="primary" type="submit">Вход</button>
      <div id="login-error"></div>
    </form>
  </div>

  <div id="mfa-challenge-view" style="display:none; max-width:320px; margin:80px auto">
    <h1>Код за потвърждение</h1>
    <p class="lede">Отвори приложението за удостоверяване (Google Authenticator и подобни) и въведи 6-цифрения код.</p>
    <form id="mfa-challenge-form">
      <input id="mfa-challenge-code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="123456"
        style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;letter-spacing:.3em;text-align:center" required />
      <button class="primary" type="submit" style="width:100%;margin-top:14px;padding:9px">Потвърди</button>
      <div id="mfa-challenge-error" style="color:var(--red);font-size:.85rem;margin-top:10px;min-height:1.2em"></div>
    </form>
  </div>

  <div id="app-view" class="wrap" style="display:none">
    <header class="top">
      <h1>Органайзер</h1>
      <div>
        <span class="who" id="who-label"></span>
        <button id="mfa-setup-btn" style="margin-left:10px">2FA</button>
        <button id="logout-btn" style="margin-left:10px">Изход</button>
      </div>
    </header>

    <div id="mfa-setup-panel" class="table-wrap" style="display:none; padding:16px; margin-bottom:18px">
      <div id="mfa-setup-status">Зареждане…</div>
    </div>

    <nav class="tabs">
      <button class="tab active" data-tab="tasks">Задачи</button>
      <button class="tab" data-tab="clients" id="clients-tab-btn" style="display:none">Клиенти</button>
    </nav>

    <div id="banner-area"></div>

    <section id="tasks-panel">
      <div class="kpis" id="kpis"></div>
      <div class="cards" id="tasks-body"><div class="loading">Зареждане…</div></div>
    </section>

    <section id="clients-panel" style="display:none">
      <form id="new-client-form" class="table-wrap" style="padding:14px 16px; margin-bottom:16px; display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end">
        <div><label style="display:block;font-size:.78rem;color:var(--muted)">Име</label>
          <input id="nc-name" required style="padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)" /></div>
        <div><label style="display:block;font-size:.78rem;color:var(--muted)">ЕИК/ЕГН</label>
          <input id="nc-eik" required style="padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)" /></div>
        <div><label style="display:block;font-size:.78rem;color:var(--muted)">Тип</label>
          <select id="nc-type" style="padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)">
            <option value="legal_entity">Юридическо лице</option>
            <option value="individual">Физическо лице</option>
          </select></div>
        <div><label style="display:block;font-size:.78rem;color:var(--muted)">Отговорник</label>
          <select id="nc-responsible" style="padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)"></select></div>
        <button class="primary" type="submit">+ Нов клиент</button>
      </form>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Име</th><th>ЕИК/ЕГН</th><th>Тип</th><th>Отговорник</th><th>Активен</th></tr></thead>
          <tbody id="clients-body"><tr><td colspan="5" class="loading">Зареждане…</td></tr></tbody>
        </table>
      </div>
    </section>
  </div>

  <button id="ai-toggle" title="Помощник">?</button>
  <div id="ai-panel">
    <header>Помощник</header>
    <div id="ai-log"></div>
    <form id="ai-form">
      <input id="ai-input" placeholder="Въпрос…" autocomplete="off" />
    </form>
  </div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

// Публични стойности — предназначени да са в браузъра, защитата е
// през RLS (SPEC.md §11), не през тайна на тези две.
const SUPABASE_URL = "https://ekyvbmokklfyrjkshuuu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_AqiAa92i6VGUuwwUGDE0pw_5tqr5ahB";
// Смени с реалния адрес на ai-helper функцията, ако Supabase ѝ е
// дал друго име при деплой (виж supabase/functions/ai-helper/README.md).
// Истинското деплойнато име е "super-handler" (Supabase го генерира
// случайно при създаването, не "ai-helper").
const AI_HELPER_URL = `${SUPABASE_URL}/functions/v1/super-handler`;
// Истинското деплойнато име на recognize-confirmation функцията е
// "hyper-handler" (Supabase го генерира случайно при създаването).
const RECOGNIZE_URL = `${SUPABASE_URL}/functions/v1/hyper-handler`;

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STATUS_LABEL = {
  waiting: "Чакаща", in_progress: "В процес", submitted: "Подадена", completed: "Завършена",
};
const NEXT_STATUS = { waiting: "in_progress", in_progress: "submitted" };
const NEXT_LABEL = { waiting: "Започни", in_progress: "Маркирай подадена" };

let myProfile = null;
let usersById = {}; // id -> full_name (само за admin изгледа)
let openTaskId = null; // кой ред е разгънат в момента

const loginView = document.getElementById("login-view");
const appView = document.getElementById("app-view");
const loginForm = document.getElementById("login-form");
const loginError = document.getElementById("login-error");
const whoLabel = document.getElementById("who-label");
const bannerArea = document.getElementById("banner-area");

function showBanner(msg, kind = "err") {
  bannerArea.innerHTML = `<div class="banner ${kind}">${msg}</div>`;
  if (kind === "ok") setTimeout(() => (bannerArea.innerHTML = ""), 3500);
}

function todayISO() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Sofia" }).format(new Date());
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Одит лог (SPEC.md §11) — всеки пише само своите действия, RLS
// (0004_audit_self_insert.sql) го налага и на ниво база, не само тук.
async function logAudit(entityType, entityId, action, details) {
  if (!myProfile) return;
  await supabase.from("audit_log").insert({
    entity_type: entityType, entity_id: entityId, action,
    actor_user_id: myProfile.id, details: details ?? null,
  });
}

// ---------------- Auth ----------------

const mfaChallengeView = document.getElementById("mfa-challenge-view");
const mfaChallengeForm = document.getElementById("mfa-challenge-form");
const mfaChallengeError = document.getElementById("mfa-challenge-error");
let pendingMfaFactorId = null;

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  loginError.textContent = "";
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) loginError.textContent = "Грешен имейл или парола.";
});

document.getElementById("logout-btn").addEventListener("click", async () => {
  await supabase.auth.signOut();
});

supabase.auth.onAuthStateChange((_event, session) => {
  if (session) checkMfaAndProceed(); else showLogin();
});

function showLogin() {
  loginView.style.display = "block";
  mfaChallengeView.style.display = "none";
  appView.style.display = "none";
  myProfile = null;
}

// Проверява дали влезлият потребител има регистрирано 2FA, което
// още не е потвърдено за тази сесия (AAL1 → AAL2) — SPEC.md §11.
async function checkMfaAndProceed() {
  const { data, error } = await supabase.auth.mfa.getAuthenticatorAssuranceLevel();
  if (error) { console.error(error); return enterApp(); }
  if (data.nextLevel === "aal2" && data.currentLevel !== data.nextLevel) {
    loginView.style.display = "none";
    appView.style.display = "none";
    mfaChallengeView.style.display = "block";
    const { data: factors } = await supabase.auth.mfa.listFactors();
    pendingMfaFactorId = factors?.totp?.[0]?.id ?? null;
  } else {
    enterApp();
  }
}

mfaChallengeForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  mfaChallengeError.textContent = "";
  const code = document.getElementById("mfa-challenge-code").value.trim();
  if (!pendingMfaFactorId) { mfaChallengeError.textContent = "Не намирам регистриран 2FA фактор."; return; }
  const { data: challenge, error: chErr } = await supabase.auth.mfa.challenge({ factorId: pendingMfaFactorId });
  if (chErr) { mfaChallengeError.textContent = chErr.message; return; }
  const { error: vErr } = await supabase.auth.mfa.verify({
    factorId: pendingMfaFactorId, challengeId: challenge.id, code,
  });
  if (vErr) { mfaChallengeError.textContent = "Грешен код. Пробвай пак."; return; }
  mfaChallengeView.style.display = "none";
  enterApp();
});

async function enterApp() {
  loginView.style.display = "none";
  appView.style.display = "block";

  const { data: { user } } = await supabase.auth.getUser();
  const { data: profile, error } = await supabase
    .from("profiles").select("id, full_name, role").eq("id", user.id).single();
  if (error) { showBanner("Не успях да заредя профила: " + error.message); return; }
  myProfile = profile;

  whoLabel.textContent = `${profile.full_name} · ${profile.role === "admin" ? "admin" : "счетоводител"}`;
  document.getElementById("clients-tab-btn").style.display = profile.role === "admin" ? "" : "none";

  if (profile.role === "admin") {
    const { data: profs } = await supabase.from("profiles").select("id, full_name");
    usersById = Object.fromEntries((profs ?? []).map((p) => [p.id, p.full_name]));
  } else {
    usersById = { [profile.id]: profile.full_name };
  }

  loadTasks();
  refreshMfaSetupStatus({ autoPrompt: true });
}

// ---------------- Регистрация на 2FA (SPEC.md §11) ----------------

const mfaSetupBtn = document.getElementById("mfa-setup-btn");
const mfaSetupPanel = document.getElementById("mfa-setup-panel");
const mfaSetupStatus = document.getElementById("mfa-setup-status");

mfaSetupBtn.addEventListener("click", () => {
  const opening = mfaSetupPanel.style.display === "none";
  mfaSetupPanel.style.display = opening ? "block" : "none";
  if (opening) refreshMfaSetupStatus();
});

async function refreshMfaSetupStatus(opts) {
  const { data, error } = await supabase.auth.mfa.listFactors();
  if (error) { mfaSetupStatus.innerHTML = "Грешка: " + escapeHtml(error.message); return; }
  const verified = (data.totp ?? []).filter((f) => f.status === "verified");

  // Изисква се 2FA за всички служители (не само admin, по изрично
  // решение) — при първи вход без регистрирано 2FA панелът се
  // отваря автоматично, с ясно съобщение, вместо да чака да намери
  // бутона сам. Не е твърда блокировка (не спира достъпа до
  // останалото приложение), за да няма риск от заключване при бъг.
  if (verified.length === 0 && opts?.autoPrompt) {
    mfaSetupPanel.style.display = "block";
    showBanner("Изисква се активиране на 2FA за твоя акаунт — виж панела по-долу.");
  }

  if (verified.length > 0) {
    mfaSetupStatus.innerHTML = `
      <p style="margin:0 0 10px">✅ 2FA е активирано за твоя акаунт.</p>
      <button class="small" id="mfa-remove-btn">Изключи 2FA</button>
    `;
    document.getElementById("mfa-remove-btn").addEventListener("click", async () => {
      if (!confirm("Сигурен ли си, че искаш да изключиш 2FA?")) return;
      await supabase.auth.mfa.unenroll({ factorId: verified[0].id });
      refreshMfaSetupStatus();
    });
    return;
  }

  mfaSetupStatus.innerHTML = `
    <p style="margin:0 0 10px">2FA не е активирано. Препоръчително е поне за admin акаунта (SPEC.md §11).</p>
    <button class="small primary" id="mfa-enroll-btn">Активирай 2FA</button>
    <div id="mfa-enroll-area" style="margin-top:12px"></div>
  `;
  document.getElementById("mfa-enroll-btn").addEventListener("click", async () => {
    // Изчиства недовършени по-стари опити за enroll, иначе Supabase
    // отказва нов enroll при вече "unverified" фактор.
    const { data: existing } = await supabase.auth.mfa.listFactors();
    for (const f of existing?.totp ?? []) {
      if (f.status !== "verified") await supabase.auth.mfa.unenroll({ factorId: f.id });
    }

    const { data, error } = await supabase.auth.mfa.enroll({ factorType: "totp" });
    if (error) { showBanner("Грешка: " + error.message); return; }
    const area = document.getElementById("mfa-enroll-area");
    area.innerHTML = `
      <p style="font-size:.85rem;color:var(--muted)">Сканирай с приложение за удостоверяване (Google Authenticator и подобни):</p>
      <div style="max-width:200px">${data.totp.qr_code}</div>
      <p style="font-size:.78rem;color:var(--muted)">Или въведи ръчно: <code>${escapeHtml(data.totp.secret)}</code></p>
      <input id="mfa-enroll-code" inputmode="numeric" maxlength="6" placeholder="123456"
        style="padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);letter-spacing:.2em" />
      <button class="small primary" id="mfa-confirm-btn">Потвърди</button>
    `;
    document.getElementById("mfa-confirm-btn").addEventListener("click", async () => {
      const code = document.getElementById("mfa-enroll-code").value.trim();
      const { data: challenge, error: chErr } = await supabase.auth.mfa.challenge({ factorId: data.id });
      if (chErr) { showBanner("Грешка: " + chErr.message); return; }
      const { error: vErr } = await supabase.auth.mfa.verify({ factorId: data.id, challengeId: challenge.id, code });
      if (vErr) { showBanner("Грешен код, пробвай пак."); return; }
      logAudit("profile", myProfile.id, "mfa_enabled", null);
      showBanner("2FA е активирано успешно.", "ok");
      refreshMfaSetupStatus();
    });
  });
}

const MONTH_ABBR = ["яну", "фев", "мар", "апр", "май", "юни", "юли", "авг", "сеп", "окт", "ное", "дек"];
function formatDueBox(iso) {
  const [, m, d] = iso.split("-").map(Number);
  return { day: String(d).padStart(2, "0"), month: MONTH_ABBR[m - 1] };
}
function addDaysISO(iso, days) {
  const dt = new Date(iso + "T00:00:00Z");
  dt.setUTCDate(dt.getUTCDate() + days);
  return dt.toISOString().slice(0, 10);
}

async function loadTasks() {
  const body = document.getElementById("tasks-body");
  const kpis = document.getElementById("kpis");
  body.innerHTML = `<div class="loading">Зареждане…</div>`;

  const { data, error } = await supabase
    .from("tasks")
    .select(`
      id, period_label, due_date, status, assigned_user_id, confirmation_status,
      clients ( name ),
      obligation_types ( name, requires_payment, requires_confirmation_upload ),
      attachments!attachments_task_id_fkey ( kind, uploaded_at, recognized_reference_number, client_name_mismatch, duplicate_of_attachment_id )
    `)
    .order("due_date", { ascending: true });

  if (error) { body.innerHTML = `<div class="empty">Грешка: ${error.message}</div>`; kpis.innerHTML = ""; return; }
  if (!data || data.length === 0) { body.innerHTML = `<div class="empty">Няма задачи (все още).</div>`; kpis.innerHTML = ""; return; }

  const today = todayISO();
  const soon = addDaysISO(today, 5);

  // За всяка задача — последното качено потвърждение (по дата), за
  // да вземем от него вх. номер и предупрежденията за проверка.
  const withLatest = data.map((t) => {
    const confirmations = (t.attachments ?? [])
      .filter((a) => a.kind === "confirmation")
      .sort((a, b) => new Date(b.uploaded_at) - new Date(a.uploaded_at));
    return { t, latest: confirmations[0] ?? null };
  });

  const overdueCount = withLatest.filter(({ t }) => t.due_date < today && t.status !== "completed").length;
  const soonCount = withLatest.filter(({ t }) => t.due_date >= today && t.due_date <= soon && t.status !== "completed").length;
  const reviewCount = withLatest.filter(({ latest }) => latest?.client_name_mismatch || latest?.duplicate_of_attachment_id).length;
  const { count: activeClients } = await supabase.from("clients").select("id", { count: "exact", head: true }).eq("active", true);

  kpis.innerHTML = `
    <div class="kpi"><div class="n ${overdueCount > 0 ? "warn" : ""}">${overdueCount}</div><div class="l">Просрочени</div></div>
    <div class="kpi"><div class="n">${soonCount}</div><div class="l">До 5 дни</div></div>
    <div class="kpi"><div class="n ${reviewCount > 0 ? "warn" : ""}">${reviewCount}</div><div class="l">Изискват проверка</div></div>
    <div class="kpi"><div class="n">${activeClients ?? "—"}</div><div class="l">Активни клиенти</div></div>
  `;

  body.innerHTML = "";
  for (const { t, latest } of withLatest) {
    const card = document.createElement("div");
    const overdue = t.due_date < today && t.status !== "completed";
    card.className = "card" + (overdue ? " overdue" : "");
    card.dataset.id = t.id;
    const nextStatus = NEXT_STATUS[t.status];
    const { day, month } = formatDueBox(t.due_date);
    card.innerHTML = `
      <div class="datebox"><div class="d">${day}</div><div class="m">${month}</div></div>
      <div class="info">
        <div class="client">${escapeHtml(t.clients?.name ?? "?")}</div>
        <div class="obl">${escapeHtml(t.obligation_types?.name ?? "?")} · ${escapeHtml(t.period_label)}</div>
        ${latest?.recognized_reference_number ? `<div class="ref">Вх. № ${escapeHtml(latest.recognized_reference_number)}</div>` : ""}
      </div>
      <div class="meta">
        <span class="pill pill-${t.status}">${STATUS_LABEL[t.status] ?? t.status}</span>
        ${t.confirmation_status === "accepted" ? '<span class="pill pill-accepted">потвърд. прието</span>' : ""}
        ${t.confirmation_status === "rejected" ? '<span class="pill pill-rejected">потвърд. отказано</span>' : ""}
        ${latest?.client_name_mismatch ? '<span class="pill pill-rejected">⚠ друга фирма</span>' : ""}
        ${latest?.duplicate_of_attachment_id ? '<span class="pill pill-rejected">⚠ дублиран №</span>' : ""}
        <span class="assignee">${usersById[t.assigned_user_id] ?? "—"}</span>
        <div class="row-actions">
          ${nextStatus ? `<button data-id="${t.id}" data-next="${nextStatus}" class="advance-btn small">${NEXT_LABEL[t.status]}</button>` : ""}
          ${t.status !== "completed" ? `<button data-id="${t.id}" class="complete-btn small">Завърши</button>` : ""}
        </div>
      </div>
    `;
    body.appendChild(card);
  }

  body.querySelectorAll(".card").forEach((card) => {
    card.addEventListener("click", (e) => {
      if (e.target.closest("button")) return; // не разгъвай при клик върху бутон
      toggleDetail(card, data.find((t) => t.id === card.dataset.id));
    });
  });

  body.querySelectorAll(".advance-btn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      const { error } = await supabase.from("tasks").update({ status: btn.dataset.next }).eq("id", btn.dataset.id);
      if (error) { showBanner("Грешка при промяна: " + error.message); btn.disabled = false; return; }
      logAudit("task", btn.dataset.id, "status_changed", { to: btn.dataset.next });
      showBanner("Обновено.", "ok");
      loadTasks();
    });
  });

  body.querySelectorAll(".complete-btn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const task = data.find((t) => t.id === btn.dataset.id);
      const needsConfirmation = task?.obligation_types?.requires_confirmation_upload !== false;

      if (task?.confirmation_status === "rejected") {
        showBanner("Потвърждението е разпознато като ОТКАЗАНО от НАП — задачата не може да е завършена, докато не подадеш коригирана декларация и качиш ново потвърждение.");
        return;
      }

      if (needsConfirmation) {
        const { data: latestConfirmation } = await supabase
          .from("attachments")
          .select("id, client_name_mismatch, duplicate_of_attachment_id")
          .eq("task_id", btn.dataset.id).eq("kind", "confirmation")
          .order("uploaded_at", { ascending: false }).limit(1).maybeSingle();
        if (!latestConfirmation) {
          showBanner("Няма прикачено потвърждение — качи го първо (разгъни задачата), преди да я завършиш.");
          return;
        }
        if (latestConfirmation.client_name_mismatch) {
          showBanner("Потвърждението изглежда за ДРУГА фирма — провери преди да завършиш (виж бележката в детайлите на задачата).");
          return;
        }
        if (latestConfirmation.duplicate_of_attachment_id) {
          showBanner("Този входящ номер вече е качен друг път — провери дали не е дублирано, преди да завършиш.");
          return;
        }
      }

      // Изрично потвърждение от човек — дори системата да е разпознала
      // "приета" в потвърждението, не затваряме автоматично (SPEC.md §4).
      if (!confirm("Сигурен ли си, че задачата е завършена?")) return;
      btn.disabled = true;
      const { error } = await supabase.from("tasks").update({
        status: "completed", completed_at: new Date().toISOString(), completed_by: myProfile.id,
      }).eq("id", btn.dataset.id);
      if (error) { showBanner("Грешка: " + error.message); btn.disabled = false; return; }
      logAudit("task", btn.dataset.id, "status_changed", { to: "completed" });
      showBanner("Задачата е завършена.", "ok");
      loadTasks();
    });
  });
}

// ---------------- Детайли на задача: потвърждение + плащане ----------------

async function toggleDetail(card, task) {
  const existing = card.nextElementSibling;
  if (existing && existing.classList.contains("detail-panel")) {
    existing.remove();
    openTaskId = null;
    return;
  }
  document.querySelectorAll(".detail-panel").forEach((r) => r.remove());
  openTaskId = task.id;

  const detailDiv = document.createElement("div");
  detailDiv.className = "detail-panel";
  detailDiv.innerHTML = `<div class="detail-grid">
    <div class="detail-block">
      <h4>Потвърждение</h4>
      <div id="attachments-list-${task.id}">Зареждане…</div>
      ${task.obligation_types?.requires_confirmation_upload !== false ? `
        <input type="file" id="file-input-${task.id}" accept="application/pdf,image/*" style="margin-top:8px" />
        <button class="small" id="upload-btn-${task.id}" style="margin-top:6px">Качи потвърждение</button>
      ` : ""}
    </div>
    <div class="detail-block">
      <h4>Плащане</h4>
      <div id="payment-info-${task.id}">Зареждане…</div>
    </div>
  </div>`;
  card.after(detailDiv);

  // Прикачени файлове
  const { data: attachments } = await supabase
    .from("attachments")
    .select("id, kind, uploaded_at, recognized_marker, recognized_reference_number, recognized_client_name, client_name_mismatch, duplicate_of_attachment_id")
    .eq("task_id", task.id).order("uploaded_at", { ascending: false });
  const attList = document.getElementById(`attachments-list-${task.id}`);
  if (!attachments || attachments.length === 0) {
    attList.innerHTML = `<div style="color:var(--muted)">Няма качени файлове.</div>`;
  } else {
    attList.innerHTML = attachments.map((a) => `
      <div class="attachment-item">
        ${a.kind === "confirmation" ? "Потвърждение" : a.kind === "payment_proof" ? "Доказателство за плащане" : "Друго"}
        — ${new Date(a.uploaded_at).toLocaleString("bg-BG")}
        ${a.recognized_marker ? `<span class="pill pill-${a.recognized_marker}" style="margin-left:6px">${a.recognized_marker === "accepted" ? "разпознато: прието" : "разпознато: отказано"}</span>` : ""}
        ${a.recognized_reference_number ? `<div style="font-size:.78rem;color:var(--muted);margin-top:2px">Вх. № ${escapeHtml(a.recognized_reference_number)}${a.recognized_client_name ? " · " + escapeHtml(a.recognized_client_name) : ""}</div>` : ""}
        ${a.duplicate_of_attachment_id ? `<div style="margin-top:4px"><span class="pill pill-rejected">⚠ дублиран входящ номер — вече качен друг път</span></div>` : ""}
        ${a.client_name_mismatch ? `<div style="margin-top:4px"><span class="pill pill-rejected">⚠ документът е за друга фирма — провери!</span></div>` : ""}
      </div>
    `).join("");
  }

  const uploadBtn = document.getElementById(`upload-btn-${task.id}`);
  if (uploadBtn) {
    uploadBtn.addEventListener("click", async () => {
      const input = document.getElementById(`file-input-${task.id}`);
      const file = input.files[0];
      if (!file) { showBanner("Избери файл първо."); return; }
      uploadBtn.disabled = true;
      // Supabase Storage не приема кирилица/интервали/специални
      // знаци в ключа на обекта — пазим оригиналното име само в
      // самия файл (браузърът го праща отделно), не в пътя.
      const extMatch = file.name.match(/\.[a-zA-Z0-9]+$/);
      const ext = extMatch ? extMatch[0] : "";
      const path = `${task.id}/${Date.now()}${ext}`;
      const { error: upErr } = await supabase.storage.from("attachments").upload(path, file);
      if (upErr) { showBanner("Грешка при качване: " + upErr.message); uploadBtn.disabled = false; return; }
      const { data: newAttachment, error: insErr } = await supabase.from("attachments").insert({
        task_id: task.id, kind: "confirmation", storage_path: path, uploaded_by: myProfile.id,
      }).select("id").single();
      if (insErr) { showBanner("Файлът се качи, но записът в базата гръмна: " + insErr.message); return; }
      // Прикачено потвърждение → статус "Подадена" (ако още не е по-напред)
      if (task.status === "waiting" || task.status === "in_progress") {
        await supabase.from("tasks").update({ status: "submitted" }).eq("id", task.id);
      }
      logAudit("attachment", task.id, "confirmation_uploaded", { path });

      // Извикваме разпознаването директно оттук (вместо Database
      // Webhook — блокиран от бъг в Supabase, липсваща схема
      // "supabase_functions"). Не чакаме резултата за UI-то, но
      // грешката вече не се поглъща тихо (както по-рано — заради
      // това не забелязахме липсващите CORS хедъри при първия тест).
      fetch(RECOGNIZE_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ record: { id: newAttachment.id, task_id: task.id, storage_path: path, kind: "confirmation" } }),
      })
        .then((r) => r.ok ? null : r.text().then((t) => console.error("recognize-confirmation:", r.status, t)))
        .catch((e) => console.error("recognize-confirmation fetch failed:", e));

      showBanner("Потвърждението е качено.", "ok");
      loadTasks();
    });
  }

  // Плащане
  const { data: payment } = await supabase
    .from("task_payments").select("id, amount_due, due_date, paid, paid_at")
    .eq("task_id", task.id).maybeSingle();
  const payInfo = document.getElementById(`payment-info-${task.id}`);
  if (!payment) {
    payInfo.innerHTML = `<div style="color:var(--muted)">Няма изискване за плащане по това задължение.</div>`;
  } else {
    payInfo.innerHTML = `
      <div>Срок: <b>${payment.due_date}</b></div>
      <div>Сума: ${payment.amount_due ? payment.amount_due + " лв." : "не е въведена"}</div>
      <div style="margin-top:8px">
        ${payment.paid
          ? `<span class="pill pill-completed">Платено на ${new Date(payment.paid_at).toLocaleDateString("bg-BG")}</span>`
          : `<button class="small" id="mark-paid-${payment.id}">Маркирай платено</button>`}
      </div>
    `;
    const markBtn = document.getElementById(`mark-paid-${payment.id}`);
    if (markBtn) {
      markBtn.addEventListener("click", async () => {
        markBtn.disabled = true;
        const { error } = await supabase.from("task_payments")
          .update({ paid: true, paid_at: new Date().toISOString() }).eq("id", payment.id);
        if (error) { showBanner("Грешка: " + error.message); markBtn.disabled = false; return; }
        logAudit("task_payment", payment.id, "marked_paid", { task_id: task.id });
        showBanner("Маркирано като платено.", "ok");
        toggleDetail(card, task); toggleDetail(card, task); // презареди детайла
      });
    }
  }
}

// ---------------- Клиенти (admin) ----------------

function maskEgn(egn, type) {
  if (type !== "individual" || !egn || egn.length <= 4) return escapeHtml(egn ?? "");
  return "•".repeat(egn.length - 4) + egn.slice(-4);
}

function populateResponsibleSelect() {
  const sel = document.getElementById("nc-responsible");
  if (!sel) return;
  sel.innerHTML = Object.entries(usersById).map(([id, name]) => `<option value="${id}">${escapeHtml(name)}</option>`).join("");
}

document.getElementById("new-client-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = document.getElementById("nc-name").value.trim();
  const eik = document.getElementById("nc-eik").value.trim();
  const type = document.getElementById("nc-type").value;
  const responsible = document.getElementById("nc-responsible").value;
  if (!name || !eik) return;
  const { data: newClient, error } = await supabase.from("clients").insert({
    name, eik_egn: eik, type, responsible_user_id: responsible || null,
  }).select("id").single();
  if (error) { showBanner("Грешка при създаване: " + error.message); return; }
  logAudit("client", newClient.id, "created", { name });
  document.getElementById("new-client-form").reset();
  showBanner("Клиентът е създаден.", "ok");
  loadClients();
});

async function loadClients() {
  const body = document.getElementById("clients-body");
  body.innerHTML = `<tr><td colspan="5" class="loading">Зареждане…</td></tr>`;
  populateResponsibleSelect();

  const { data, error } = await supabase
    .from("clients")
    .select("id, name, eik_egn, type, active, responsible_user_id")
    .order("name");

  if (error) { body.innerHTML = `<tr><td colspan="5" class="empty">Грешка: ${error.message}</td></tr>`; return; }
  if (!data || data.length === 0) { body.innerHTML = `<tr><td colspan="5" class="empty">Няма клиенти още.</td></tr>`; return; }

  body.innerHTML = "";
  for (const c of data) {
    const tr = document.createElement("tr");
    tr.className = "task-row"; // преизползваме hover/cursor стила
    tr.dataset.id = c.id;
    const masked = maskEgn(c.eik_egn, c.type);
    const isMasked = masked !== c.eik_egn;
    tr.innerHTML = `
      <td>${escapeHtml(c.name)}</td>
      <td>
        <span class="egn-cell">${masked}</span>
        ${isMasked ? `<a class="linklike reveal-egn" data-full="${escapeHtml(c.eik_egn)}" style="margin-left:6px">покажи</a>` : ""}
      </td>
      <td>${c.type === "legal_entity" ? "ЮЛ" : "ФЛ"}</td>
      <td>${usersById[c.responsible_user_id] ?? "—"}</td>
      <td>${c.active ? "да" : "не"}</td>
    `;
    body.appendChild(tr);
  }

  body.querySelectorAll(".reveal-egn").forEach((a) => {
    a.addEventListener("click", (e) => {
      e.stopPropagation();
      const cell = a.previousElementSibling;
      const showing = a.textContent === "скрий";
      cell.textContent = showing ? maskEgn(a.dataset.full, "individual") : a.dataset.full;
      a.textContent = showing ? "покажи" : "скрий";
    });
  });

  body.querySelectorAll("tr.task-row").forEach((tr) => {
    tr.addEventListener("click", (e) => {
      if (e.target.closest("a") || e.target.closest("button")) return;
      toggleClientSettings(tr);
    });
  });
}

const DOSSIER_FLAGS = { sol: "СОЛ", td: "ТД", gd: "ГД" };

async function toggleClientSettings(tr) {
  const existing = tr.nextElementSibling;
  if (existing && existing.classList.contains("detail-row")) { existing.remove(); return; }
  document.querySelectorAll(".detail-row").forEach((r) => r.remove());

  const clientId = tr.dataset.id;
  const detailTr = document.createElement("tr");
  detailTr.className = "detail-row";
  detailTr.innerHTML = `<td colspan="5"><div class="detail-grid">
    <div class="detail-block">
      <h4>Досие (СОЛ / ТД / ГД)</h4>
      <div id="dossier-${clientId}">Зареждане…</div>
    </div>
    <div class="detail-block">
      <h4>Настройки — кои задължения важат</h4>
      <div id="settings-${clientId}" style="max-height:260px;overflow-y:auto">Зареждане…</div>
    </div>
  </div></td>`;
  tr.after(detailTr);

  // Досие — текущо активни флагове (ended_on is null)
  const { data: flags } = await supabase
    .from("client_dossier_flags").select("id, flag").eq("client_id", clientId).is("ended_on", null);
  const activeFlags = new Set((flags ?? []).map((f) => f.flag));
  const dossierDiv = document.getElementById(`dossier-${clientId}`);
  dossierDiv.innerHTML = Object.entries(DOSSIER_FLAGS).map(([code, label]) => `
    <label style="display:block;margin-bottom:6px">
      <input type="checkbox" class="dossier-cb" data-flag="${code}" ${activeFlags.has(code) ? "checked" : ""} /> ${label}
    </label>
  `).join("");
  dossierDiv.querySelectorAll(".dossier-cb").forEach((cb) => {
    cb.addEventListener("change", async () => {
      cb.disabled = true;
      if (cb.checked) {
        await supabase.from("client_dossier_flags").insert({
          client_id: clientId, flag: cb.dataset.flag, started_on: todayISO(),
        });
      } else {
        await supabase.from("client_dossier_flags")
          .update({ ended_on: todayISO() })
          .eq("client_id", clientId).eq("flag", cb.dataset.flag).is("ended_on", null);
      }
      logAudit("client", clientId, "dossier_flag_changed", { flag: cb.dataset.flag, active: cb.checked });
      cb.disabled = false;
      showBanner("Досието е обновено.", "ok");
    });
  });

  // Настройки — всички текущи видове задължения + кои са включени
  const { data: obligations } = await supabase
    .from("obligation_types").select("id, code, name").is("valid_to", null).order("name");
  const { data: settings } = await supabase
    .from("client_obligation_settings").select("obligation_type_id, enabled").eq("client_id", clientId);
  const enabledIds = new Set((settings ?? []).filter((s) => s.enabled).map((s) => s.obligation_type_id));

  const settingsDiv = document.getElementById(`settings-${clientId}`);
  settingsDiv.innerHTML = (obligations ?? []).map((o) => `
    <label style="display:block;margin-bottom:5px;font-size:.82rem">
      <input type="checkbox" class="obligation-cb" data-oid="${o.id}" ${enabledIds.has(o.id) ? "checked" : ""} /> ${escapeHtml(o.name)}
    </label>
  `).join("");
  settingsDiv.querySelectorAll(".obligation-cb").forEach((cb) => {
    cb.addEventListener("change", async () => {
      cb.disabled = true;
      const { error } = await supabase.from("client_obligation_settings").upsert({
        client_id: clientId, obligation_type_id: cb.dataset.oid,
        enabled: cb.checked, overridden_by_admin: true,
      }, { onConflict: "client_id,obligation_type_id" });
      if (error) showBanner("Грешка: " + error.message);
      else logAudit("client", clientId, "obligation_setting_changed", { obligation_type_id: cb.dataset.oid, enabled: cb.checked });
      cb.disabled = false;
    });
  });
}

// ---------------- AI помощник ----------------

const aiToggle = document.getElementById("ai-toggle");
const aiPanel = document.getElementById("ai-panel");
const aiLog = document.getElementById("ai-log");
const aiForm = document.getElementById("ai-form");
const aiInput = document.getElementById("ai-input");
let aiHistory = [];

aiToggle.addEventListener("click", () => aiPanel.classList.toggle("open"));

aiForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = aiInput.value.trim();
  if (!msg) return;
  aiInput.value = "";
  appendAiMsg("Ти", msg, "msg-user");
  aiHistory.push({ role: "user", content: msg });

  try {
    const { data: { session } } = await supabase.auth.getSession();
    const res = await fetch(AI_HELPER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        ...(session ? { Authorization: `Bearer ${session.access_token}` } : {}),
      },
      body: JSON.stringify({ message: msg, history: aiHistory.slice(0, -1) }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error ?? "неизвестна грешка");
    appendAiMsg("Помощник", data.reply, "msg-bot");
    aiHistory.push({ role: "assistant", content: data.reply });
  } catch (err) {
    appendAiMsg("Помощник", "Не успях да отговоря (" + err.message + "). Провери дали ai-helper функцията е деплойната.", "msg-bot");
  }
});

function appendAiMsg(who, text, cls) {
  const div = document.createElement("div");
  div.className = cls;
  div.innerHTML = `<b>${escapeHtml(who)}</b>${escapeHtml(text)}`;
  aiLog.appendChild(div);
  aiLog.scrollTop = aiLog.scrollHeight;
}

// ---------------- Старт ----------------

supabase.auth.getSession().then(({ data: { session } }) => {
  if (session) checkMfaAndProceed(); else showLogin();
});
</script>
