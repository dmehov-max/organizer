<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Органайзер</title>
<style>
  :root {
    --paper: #f5f6f1;
    --ink: #20241d;
    --muted: #6b6a58;
    --line: #d9d6c8;
    --accent: #2f6b4f;
    --accent-ink: #1e4a35;
    --accent-soft: #e1ebe3;
    --amber: #93650f;
    --amber-soft: #f2e6cc;
    --red: #a33b2f;
    --red-soft: #f5e3e0;
    --card: #fbfbf8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14160f; --ink: #e8e6d9; --muted: #a29d87; --line: #2d3123;
      --accent: #74c39a; --accent-ink: #a8dcc0; --accent-soft: rgba(116,195,154,.14);
      --amber: #e0b563; --amber-soft: rgba(224,181,99,.14);
      --red: #e2897c; --red-soft: rgba(226,137,124,.14);
      --card: #1b1e15;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: -apple-system, "Segoe UI", "Noto Sans", system-ui, sans-serif;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 20px 80px; }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 16px; margin-bottom: 20px; border-bottom: 1px solid var(--line);
  }
  header.top h1 { font-size: 1.3rem; margin: 0; }
  header.top .who { font-size: .85rem; color: var(--muted); }
  button {
    font: inherit; cursor: pointer; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); border-radius: 4px; padding: 6px 12px;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.small { padding: 3px 8px; font-size: .8rem; }
  button:disabled { opacity: .5; cursor: default; }
  a.linklike { color: var(--accent-ink); cursor: pointer; font-size: .8rem; background: none; border: none; padding: 0; text-decoration: underline; }

  /* --- login --- */
  #login-view { max-width: 360px; margin: 80px auto; }
  #login-view h1 { font-size: 1.4rem; margin-bottom: 4px; }
  #login-view p.lede { color: var(--muted); margin-top: 0; margin-bottom: 24px; font-size: .92rem; }
  #login-view label { display: block; font-size: .82rem; color: var(--muted); margin: 12px 0 4px; }
  #login-view input {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px;
    background: var(--card); color: var(--ink); font: inherit;
  }
  #login-view button { width: 100%; margin-top: 18px; padding: 9px; }
  #login-error { color: var(--red); font-size: .85rem; margin-top: 10px; min-height: 1.2em; }

  /* --- tabs --- */
  nav.tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  nav.tabs button.tab { background: none; border: none; padding: 6px 4px; color: var(--muted); border-bottom: 2px solid transparent; border-radius: 0; }
  nav.tabs button.tab.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

  /* --- table --- */
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; min-width: 640px; }
  thead th {
    text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line);
  }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tr.task-row { cursor: pointer; }
  tr.task-row:hover { background: var(--accent-soft); }
  td.due { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.due.overdue { color: var(--red); font-weight: 600; }
  .pill { display: inline-block; font-size: .72rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
  .pill-waiting { background: var(--amber-soft); color: var(--amber); }
  .pill-in_progress { background: var(--accent-soft); color: var(--accent-ink); }
  .pill-submitted { background: var(--accent-soft); color: var(--accent-ink); }
  .pill-completed { background: var(--line); color: var(--muted); }
  .pill-accepted { background: var(--accent-soft); color: var(--accent-ink); }
  .pill-rejected { background: var(--red-soft); color: var(--red); }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  .loading { padding: 30px; text-align: center; color: var(--muted); }
  .banner { padding: 10px 14px; border-radius: 4px; font-size: .85rem; margin-bottom: 14px; }
  .banner.err { background: var(--red-soft); color: var(--red); }
  .banner.ok { background: var(--accent-soft); color: var(--accent-ink); }

  /* --- детайли на задача --- */
  tr.detail-row td { background: var(--paper); padding: 16px 20px; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; font-size: .85rem; }
  .detail-block h4 { margin: 0 0 8px; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .attachment-item { padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .attachment-item:last-child { border-bottom: none; }

  /* --- AI chat --- */
  #ai-toggle {
    position: fixed; bottom: 20px; right: 20px; border-radius: 50%; width: 52px; height: 52px;
    background: var(--accent); color: #fff; border: none; font-size: 1.3rem; box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  #ai-panel {
    position: fixed; bottom: 84px; right: 20px; width: 320px; max-height: 440px;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,.2); display: none; flex-direction: column; overflow: hidden;
  }
  #ai-panel.open { display: flex; }
  #ai-panel header { padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: .88rem; }
  #ai-log { flex: 1; overflow-y: auto; padding: 10px 14px; font-size: .85rem; display: flex; flex-direction: column; gap: 10px; max-height: 300px; }
  #ai-log .msg-user { color: var(--ink); }
  #ai-log .msg-user b, #ai-log .msg-bot b { display: block; font-size: .7rem; color: var(--muted); margin-bottom: 2px; }
  #ai-form { display: flex; border-top: 1px solid var(--line); }
  #ai-input { flex: 1; border: none; padding: 10px; font: inherit; background: transparent; color: var(--ink); }
  #ai-input:focus { outline: none; }
</style>
</head>
<body>

  <div id="login-view">
    <h1>Органайзер</h1>
    <p class="lede">Мехов Консулт — проследяване на нормативни срокове</p>
    <form id="login-form">
      <label for="email">Имейл</label>
      <input id="email" type="email" autocomplete="username" required />
      <label for="password">Парола</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <button class="primary" type="submit">Вход</button>
      <div id="login-error"></div>
    </form>
  </div>

  <div id="app-view" class="wrap" style="display:none">
    <header class="top">
      <h1>Органайзер</h1>
      <div>
        <span class="who" id="who-label"></span>
        <button id="logout-btn" style="margin-left:10px">Изход</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="tasks">Задачи</button>
      <button class="tab" data-tab="clients" id="clients-tab-btn" style="display:none">Клиенти</button>
    </nav>

    <div id="banner-area"></div>

    <section id="tasks-panel">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Клиент</th><th>Задължение</th><th>Период</th><th>Срок</th><th>Статус</th><th>Отговорник</th><th></th></tr>
          </thead>
          <tbody id="tasks-body"><tr><td colspan="7" class="loading">Зареждане…</td></tr></tbody>
        </table>
      </div>
    </section>

    <section id="clients-panel" style="display:none">
      <form id="new-client-form" class="table-wrap" style="padding:14px 16px; margin-bottom:16px; display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end">
        <div><label style="display:block;font-size:.78rem;color:var(--muted)">Име</label>
          <input id="nc-name" required style="padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink)" /></div>
        <div><label style="display:block;font-size:.78rem;color:var(--muted)">ЕИК/ЕГН</label>
          <input id="nc-eik" required style="padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink)" /></div>
        <div><label style="display:block;font-size:.78rem;color:var(--muted)">Тип</label>
          <select id="nc-type" style="padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink)">
            <option value="legal_entity">Юридическо лице</option>
            <option value="individual">Физическо лице</option>
          </select></div>
        <div><label style="display:block;font-size:.78rem;color:var(--muted)">Отговорник</label>
          <select id="nc-responsible" style="padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink)"></select></div>
        <button class="primary" type="submit">+ Нов клиент</button>
      </form>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Име</th><th>ЕИК/ЕГН</th><th>Тип</th><th>Отговорник</th><th>Активен</th></tr></thead>
          <tbody id="clients-body"><tr><td colspan="5" class="loading">Зареждане…</td></tr></tbody>
        </table>
      </div>
    </section>
  </div>

  <button id="ai-toggle" title="Помощник">?</button>
  <div id="ai-panel">
    <header>Помощник</header>
    <div id="ai-log"></div>
    <form id="ai-form">
      <input id="ai-input" placeholder="Въпрос…" autocomplete="off" />
    </form>
  </div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

// Публични стойности — предназначени да са в браузъра, защитата е
// през RLS (SPEC.md §11), не през тайна на тези две.
const SUPABASE_URL = "https://ekyvbmokklfyrjkshuuu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_AqiAa92i6VGUuwwUGDE0pw_5tqr5ahB";
// Смени с реалния адрес на ai-helper функцията, ако Supabase ѝ е
// дал друго име при деплой (виж supabase/functions/ai-helper/README.md).
const AI_HELPER_URL = `${SUPABASE_URL}/functions/v1/ai-helper`;

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STATUS_LABEL = {
  waiting: "Чакаща", in_progress: "В процес", submitted: "Подадена", completed: "Завършена",
};
const NEXT_STATUS = { waiting: "in_progress", in_progress: "submitted" };
const NEXT_LABEL = { waiting: "Започни", in_progress: "Маркирай подадена" };

let myProfile = null;
let usersById = {}; // id -> full_name (само за admin изгледа)
let openTaskId = null; // кой ред е разгънат в момента

const loginView = document.getElementById("login-view");
const appView = document.getElementById("app-view");
const loginForm = document.getElementById("login-form");
const loginError = document.getElementById("login-error");
const whoLabel = document.getElementById("who-label");
const bannerArea = document.getElementById("banner-area");

function showBanner(msg, kind = "err") {
  bannerArea.innerHTML = `<div class="banner ${kind}">${msg}</div>`;
  if (kind === "ok") setTimeout(() => (bannerArea.innerHTML = ""), 3500);
}

function todayISO() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Sofia" }).format(new Date());
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---------------- Auth ----------------

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  loginError.textContent = "";
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) loginError.textContent = "Грешен имейл или парола.";
});

document.getElementById("logout-btn").addEventListener("click", async () => {
  await supabase.auth.signOut();
});

supabase.auth.onAuthStateChange((_event, session) => {
  if (session) enterApp(); else showLogin();
});

function showLogin() {
  loginView.style.display = "block";
  appView.style.display = "none";
  myProfile = null;
}

async function enterApp() {
  loginView.style.display = "none";
  appView.style.display = "block";

  const { data: { user } } = await supabase.auth.getUser();
  const { data: profile, error } = await supabase
    .from("profiles").select("id, full_name, role").eq("id", user.id).single();
  if (error) { showBanner("Не успях да заредя профила: " + error.message); return; }
  myProfile = profile;

  whoLabel.textContent = `${profile.full_name} · ${profile.role === "admin" ? "admin" : "счетоводител"}`;
  document.getElementById("clients-tab-btn").style.display = profile.role === "admin" ? "" : "none";

  if (profile.role === "admin") {
    const { data: profs } = await supabase.from("profiles").select("id, full_name");
    usersById = Object.fromEntries((profs ?? []).map((p) => [p.id, p.full_name]));
  } else {
    usersById = { [profile.id]: profile.full_name };
  }

  loadTasks();
}

// ---------------- Автоматичен изход при неактивност (SPEC.md §11) ----------------

const IDLE_LIMIT_MS = 30 * 60 * 1000; // 30 минути
let idleTimer;
function resetIdleTimer() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(async () => {
    if (myProfile) { await supabase.auth.signOut(); showBanner("Излязохте автоматично поради неактивност."); }
  }, IDLE_LIMIT_MS);
}
["mousemove", "keydown", "click", "scroll"].forEach((evt) =>
  document.addEventListener(evt, resetIdleTimer, { passive: true })
);
resetIdleTimer();

// ---------------- Tabs ----------------

document.querySelectorAll("nav.tabs .tab").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav.tabs .tab").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    const tab = btn.dataset.tab;
    document.getElementById("tasks-panel").style.display = tab === "tasks" ? "" : "none";
    document.getElementById("clients-panel").style.display = tab === "clients" ? "" : "none";
    if (tab === "clients") loadClients();
  });
});

// ---------------- Задачи ----------------

async function loadTasks() {
  const body = document.getElementById("tasks-body");
  body.innerHTML = `<tr><td colspan="7" class="loading">Зареждане…</td></tr>`;

  const { data, error } = await supabase
    .from("tasks")
    .select(`
      id, period_label, due_date, status, assigned_user_id, confirmation_status,
      clients ( name ),
      obligation_types ( name, requires_payment, requires_confirmation_upload )
    `)
    .order("due_date", { ascending: true });

  if (error) { body.innerHTML = `<tr><td colspan="7" class="empty">Грешка: ${error.message}</td></tr>`; return; }
  if (!data || data.length === 0) { body.innerHTML = `<tr><td colspan="7" class="empty">Няма задачи (все още).</td></tr>`; return; }

  const today = todayISO();
  body.innerHTML = "";
  for (const t of data) {
    const tr = document.createElement("tr");
    tr.className = "task-row";
    tr.dataset.id = t.id;
    const overdue = t.due_date < today && t.status !== "completed";
    const nextStatus = NEXT_STATUS[t.status];
    tr.innerHTML = `
      <td>${escapeHtml(t.clients?.name ?? "?")}</td>
      <td>${escapeHtml(t.obligation_types?.name ?? "?")}</td>
      <td>${t.period_label}</td>
      <td class="due ${overdue ? "overdue" : ""}">${t.due_date}</td>
      <td>
        <span class="pill pill-${t.status}">${STATUS_LABEL[t.status] ?? t.status}</span>
        ${t.confirmation_status === "accepted" ? '<span class="pill pill-accepted">потвърд. прието</span>' : ""}
        ${t.confirmation_status === "rejected" ? '<span class="pill pill-rejected">потвърд. отказано</span>' : ""}
      </td>
      <td>${usersById[t.assigned_user_id] ?? "—"}</td>
      <td class="row-actions">
        ${nextStatus ? `<button data-id="${t.id}" data-next="${nextStatus}" class="advance-btn small">${NEXT_LABEL[t.status]}</button>` : ""}
        ${t.status !== "completed" ? `<button data-id="${t.id}" class="complete-btn small">Завърши</button>` : ""}
      </td>
    `;
    body.appendChild(tr);
  }

  body.querySelectorAll(".task-row").forEach((tr) => {
    tr.addEventListener("click", (e) => {
      if (e.target.closest("button")) return; // не разгъвай при клик върху бутон
      toggleDetail(tr, data.find((t) => t.id === tr.dataset.id));
    });
  });

  body.querySelectorAll(".advance-btn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      const { error } = await supabase.from("tasks").update({ status: btn.dataset.next }).eq("id", btn.dataset.id);
      if (error) { showBanner("Грешка при промяна: " + error.message); btn.disabled = false; return; }
      showBanner("Обновено.", "ok");
      loadTasks();
    });
  });

  body.querySelectorAll(".complete-btn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      // Изрично потвърждение от човек — дори системата да е разпознала
      // "приета" в потвърждението, не затваряме автоматично (SPEC.md §4).
      if (!confirm("Сигурен ли си, че задачата е завършена?")) return;
      btn.disabled = true;
      const { error } = await supabase.from("tasks").update({
        status: "completed", completed_at: new Date().toISOString(), completed_by: myProfile.id,
      }).eq("id", btn.dataset.id);
      if (error) { showBanner("Грешка: " + error.message); btn.disabled = false; return; }
      showBanner("Задачата е завършена.", "ok");
      loadTasks();
    });
  });
}

// ---------------- Детайли на задача: потвърждение + плащане ----------------

async function toggleDetail(tr, task) {
  const existing = tr.nextElementSibling;
  if (existing && existing.classList.contains("detail-row")) {
    existing.remove();
    openTaskId = null;
    return;
  }
  document.querySelectorAll(".detail-row").forEach((r) => r.remove());
  openTaskId = task.id;

  const detailTr = document.createElement("tr");
  detailTr.className = "detail-row";
  detailTr.innerHTML = `<td colspan="7"><div class="detail-grid">
    <div class="detail-block">
      <h4>Потвърждение</h4>
      <div id="attachments-list-${task.id}">Зареждане…</div>
      ${task.obligation_types?.requires_confirmation_upload !== false ? `
        <input type="file" id="file-input-${task.id}" accept="application/pdf,image/*" style="margin-top:8px" />
        <button class="small" id="upload-btn-${task.id}" style="margin-top:6px">Качи потвърждение</button>
      ` : ""}
    </div>
    <div class="detail-block">
      <h4>Плащане</h4>
      <div id="payment-info-${task.id}">Зареждане…</div>
    </div>
  </div></td>`;
  tr.after(detailTr);

  // Прикачени файлове
  const { data: attachments } = await supabase
    .from("attachments").select("id, kind, uploaded_at, recognized_marker")
    .eq("task_id", task.id).order("uploaded_at", { ascending: false });
  const attList = document.getElementById(`attachments-list-${task.id}`);
  if (!attachments || attachments.length === 0) {
    attList.innerHTML = `<div style="color:var(--muted)">Няма качени файлове.</div>`;
  } else {
    attList.innerHTML = attachments.map((a) => `
      <div class="attachment-item">
        ${a.kind === "confirmation" ? "Потвърждение" : a.kind === "payment_proof" ? "Доказателство за плащане" : "Друго"}
        — ${new Date(a.uploaded_at).toLocaleString("bg-BG")}
        ${a.recognized_marker ? `<span class="pill pill-${a.recognized_marker}" style="margin-left:6px">${a.recognized_marker === "accepted" ? "разпознато: прието" : "разпознато: отказано"}</span>` : ""}
      </div>
    `).join("");
  }

  const uploadBtn = document.getElementById(`upload-btn-${task.id}`);
  if (uploadBtn) {
    uploadBtn.addEventListener("click", async () => {
      const input = document.getElementById(`file-input-${task.id}`);
      const file = input.files[0];
      if (!file) { showBanner("Избери файл първо."); return; }
      uploadBtn.disabled = true;
      const path = `${task.id}/${Date.now()}_${file.name}`;
      const { error: upErr } = await supabase.storage.from("attachments").upload(path, file);
      if (upErr) { showBanner("Грешка при качване: " + upErr.message); uploadBtn.disabled = false; return; }
      const { error: insErr } = await supabase.from("attachments").insert({
        task_id: task.id, kind: "confirmation", storage_path: path, uploaded_by: myProfile.id,
      });
      if (insErr) { showBanner("Файлът се качи, но записът в базата гръмна: " + insErr.message); return; }
      // Прикачено потвърждение → статус "Подадена" (ако още не е по-напред)
      if (task.status === "waiting" || task.status === "in_progress") {
        await supabase.from("tasks").update({ status: "submitted" }).eq("id", task.id);
      }
      showBanner("Потвърждението е качено.", "ok");
      loadTasks();
    });
  }

  // Плащане
  const { data: payment } = await supabase
    .from("task_payments").select("id, amount_due, due_date, paid, paid_at")
    .eq("task_id", task.id).maybeSingle();
  const payInfo = document.getElementById(`payment-info-${task.id}`);
  if (!payment) {
    payInfo.innerHTML = `<div style="color:var(--muted)">Няма изискване за плащане по това задължение.</div>`;
  } else {
    payInfo.innerHTML = `
      <div>Срок: <b>${payment.due_date}</b></div>
      <div>Сума: ${payment.amount_due ? payment.amount_due + " лв." : "не е въведена"}</div>
      <div style="margin-top:8px">
        ${payment.paid
          ? `<span class="pill pill-completed">Платено на ${new Date(payment.paid_at).toLocaleDateString("bg-BG")}</span>`
          : `<button class="small" id="mark-paid-${payment.id}">Маркирай платено</button>`}
      </div>
    `;
    const markBtn = document.getElementById(`mark-paid-${payment.id}`);
    if (markBtn) {
      markBtn.addEventListener("click", async () => {
        markBtn.disabled = true;
        const { error } = await supabase.from("task_payments")
          .update({ paid: true, paid_at: new Date().toISOString() }).eq("id", payment.id);
        if (error) { showBanner("Грешка: " + error.message); markBtn.disabled = false; return; }
        showBanner("Маркирано като платено.", "ok");
        toggleDetail(tr, task); toggleDetail(tr, task); // презареди детайла
      });
    }
  }
}

// ---------------- Клиенти (admin) ----------------

function maskEgn(egn, type) {
  if (type !== "individual" || !egn || egn.length <= 4) return escapeHtml(egn ?? "");
  return "•".repeat(egn.length - 4) + egn.slice(-4);
}

function populateResponsibleSelect() {
  const sel = document.getElementById("nc-responsible");
  if (!sel) return;
  sel.innerHTML = Object.entries(usersById).map(([id, name]) => `<option value="${id}">${escapeHtml(name)}</option>`).join("");
}

document.getElementById("new-client-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = document.getElementById("nc-name").value.trim();
  const eik = document.getElementById("nc-eik").value.trim();
  const type = document.getElementById("nc-type").value;
  const responsible = document.getElementById("nc-responsible").value;
  if (!name || !eik) return;
  const { error } = await supabase.from("clients").insert({
    name, eik_egn: eik, type, responsible_user_id: responsible || null,
  });
  if (error) { showBanner("Грешка при създаване: " + error.message); return; }
  document.getElementById("new-client-form").reset();
  showBanner("Клиентът е създаден.", "ok");
  loadClients();
});

async function loadClients() {
  const body = document.getElementById("clients-body");
  body.innerHTML = `<tr><td colspan="5" class="loading">Зареждане…</td></tr>`;
  populateResponsibleSelect();

  const { data, error } = await supabase
    .from("clients")
    .select("id, name, eik_egn, type, active, responsible_user_id")
    .order("name");

  if (error) { body.innerHTML = `<tr><td colspan="5" class="empty">Грешка: ${error.message}</td></tr>`; return; }
  if (!data || data.length === 0) { body.innerHTML = `<tr><td colspan="5" class="empty">Няма клиенти още.</td></tr>`; return; }

  body.innerHTML = "";
  for (const c of data) {
    const tr = document.createElement("tr");
    tr.className = "task-row"; // преизползваме hover/cursor стила
    tr.dataset.id = c.id;
    const masked = maskEgn(c.eik_egn, c.type);
    const isMasked = masked !== c.eik_egn;
    tr.innerHTML = `
      <td>${escapeHtml(c.name)}</td>
      <td>
        <span class="egn-cell">${masked}</span>
        ${isMasked ? `<a class="linklike reveal-egn" data-full="${escapeHtml(c.eik_egn)}" style="margin-left:6px">покажи</a>` : ""}
      </td>
      <td>${c.type === "legal_entity" ? "ЮЛ" : "ФЛ"}</td>
      <td>${usersById[c.responsible_user_id] ?? "—"}</td>
      <td>${c.active ? "да" : "не"}</td>
    `;
    body.appendChild(tr);
  }

  body.querySelectorAll(".reveal-egn").forEach((a) => {
    a.addEventListener("click", (e) => {
      e.stopPropagation();
      const cell = a.previousElementSibling;
      const showing = a.textContent === "скрий";
      cell.textContent = showing ? maskEgn(a.dataset.full, "individual") : a.dataset.full;
      a.textContent = showing ? "покажи" : "скрий";
    });
  });

  body.querySelectorAll("tr.task-row").forEach((tr) => {
    tr.addEventListener("click", (e) => {
      if (e.target.closest("a") || e.target.closest("button")) return;
      toggleClientSettings(tr);
    });
  });
}

const DOSSIER_FLAGS = { sol: "СОЛ", td: "ТД", gd: "ГД" };

async function toggleClientSettings(tr) {
  const existing = tr.nextElementSibling;
  if (existing && existing.classList.contains("detail-row")) { existing.remove(); return; }
  document.querySelectorAll(".detail-row").forEach((r) => r.remove());

  const clientId = tr.dataset.id;
  const detailTr = document.createElement("tr");
  detailTr.className = "detail-row";
  detailTr.innerHTML = `<td colspan="5"><div class="detail-grid">
    <div class="detail-block">
      <h4>Досие (СОЛ / ТД / ГД)</h4>
      <div id="dossier-${clientId}">Зареждане…</div>
    </div>
    <div class="detail-block">
      <h4>Настройки — кои задължения важат</h4>
      <div id="settings-${clientId}" style="max-height:260px;overflow-y:auto">Зареждане…</div>
    </div>
  </div></td>`;
  tr.after(detailTr);

  // Досие — текущо активни флагове (ended_on is null)
  const { data: flags } = await supabase
    .from("client_dossier_flags").select("id, flag").eq("client_id", clientId).is("ended_on", null);
  const activeFlags = new Set((flags ?? []).map((f) => f.flag));
  const dossierDiv = document.getElementById(`dossier-${clientId}`);
  dossierDiv.innerHTML = Object.entries(DOSSIER_FLAGS).map(([code, label]) => `
    <label style="display:block;margin-bottom:6px">
      <input type="checkbox" class="dossier-cb" data-flag="${code}" ${activeFlags.has(code) ? "checked" : ""} /> ${label}
    </label>
  `).join("");
  dossierDiv.querySelectorAll(".dossier-cb").forEach((cb) => {
    cb.addEventListener("change", async () => {
      cb.disabled = true;
      if (cb.checked) {
        await supabase.from("client_dossier_flags").insert({
          client_id: clientId, flag: cb.dataset.flag, started_on: todayISO(),
        });
      } else {
        await supabase.from("client_dossier_flags")
          .update({ ended_on: todayISO() })
          .eq("client_id", clientId).eq("flag", cb.dataset.flag).is("ended_on", null);
      }
      cb.disabled = false;
      showBanner("Досието е обновено.", "ok");
    });
  });

  // Настройки — всички текущи видове задължения + кои са включени
  const { data: obligations } = await supabase
    .from("obligation_types").select("id, code, name").is("valid_to", null).order("name");
  const { data: settings } = await supabase
    .from("client_obligation_settings").select("obligation_type_id, enabled").eq("client_id", clientId);
  const enabledIds = new Set((settings ?? []).filter((s) => s.enabled).map((s) => s.obligation_type_id));

  const settingsDiv = document.getElementById(`settings-${clientId}`);
  settingsDiv.innerHTML = (obligations ?? []).map((o) => `
    <label style="display:block;margin-bottom:5px;font-size:.82rem">
      <input type="checkbox" class="obligation-cb" data-oid="${o.id}" ${enabledIds.has(o.id) ? "checked" : ""} /> ${escapeHtml(o.name)}
    </label>
  `).join("");
  settingsDiv.querySelectorAll(".obligation-cb").forEach((cb) => {
    cb.addEventListener("change", async () => {
      cb.disabled = true;
      const { error } = await supabase.from("client_obligation_settings").upsert({
        client_id: clientId, obligation_type_id: cb.dataset.oid,
        enabled: cb.checked, overridden_by_admin: true,
      }, { onConflict: "client_id,obligation_type_id" });
      if (error) showBanner("Грешка: " + error.message);
      cb.disabled = false;
    });
  });
}

// ---------------- AI помощник ----------------

const aiToggle = document.getElementById("ai-toggle");
const aiPanel = document.getElementById("ai-panel");
const aiLog = document.getElementById("ai-log");
const aiForm = document.getElementById("ai-form");
const aiInput = document.getElementById("ai-input");
let aiHistory = [];

aiToggle.addEventListener("click", () => aiPanel.classList.toggle("open"));

aiForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = aiInput.value.trim();
  if (!msg) return;
  aiInput.value = "";
  appendAiMsg("Ти", msg, "msg-user");
  aiHistory.push({ role: "user", content: msg });

  try {
    const { data: { session } } = await supabase.auth.getSession();
    const res = await fetch(AI_HELPER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        ...(session ? { Authorization: `Bearer ${session.access_token}` } : {}),
      },
      body: JSON.stringify({ message: msg, history: aiHistory.slice(0, -1) }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error ?? "неизвестна грешка");
    appendAiMsg("Помощник", data.reply, "msg-bot");
    aiHistory.push({ role: "assistant", content: data.reply });
  } catch (err) {
    appendAiMsg("Помощник", "Не успях да отговоря (" + err.message + "). Провери дали ai-helper функцията е деплойната.", "msg-bot");
  }
});

function appendAiMsg(who, text, cls) {
  const div = document.createElement("div");
  div.className = cls;
  div.innerHTML = `<b>${escapeHtml(who)}</b>${escapeHtml(text)}`;
  aiLog.appendChild(div);
  aiLog.scrollTop = aiLog.scrollHeight;
}

// ---------------- Старт ----------------

supabase.auth.getSession().then(({ data: { session } }) => {
  if (session) enterApp(); else showLogin();
});
</script>
